appId: com.textileerp.desktop
productName: Textile ERP
copyright: Copyright (C) Textile ERP
directories:
  output: dist
  buildResources: assets
files:
  - main.js
  - preload.js
  - updater.js
  - machineId.js
  - syncAgent.js
  - config.json
  - config.example.json
  - localRuntime/**/*
  - jsmExtractor/**/*
  - renderer/**/*
  - '!renderer/downloads/**/*'
  - assets/**/*
extraResources:
  - from: config.json
    to: config.json
  - from: config.example.json
    to: config.example.json
  - from: resources/backend
    to: backend
    filter:
      - '**/*'
      - '!**/.env*'
      - '!**/api.js'
      - '!**/backups/**'
      - '!**/data/**'
  - from: vendor/mongodb
    to: vendor/mongodb
  - from: vendor/node/node.exe
    to: vendor/node/node.exe
asarUnpack:
  - localRuntime/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: TextileERP-Setup-${version}.${ext}
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Textile ERP
  deleteAppDataOnUninstall: false
releaseInfo:
  releaseNotesFile: release-notes.md
publish:
  - provider: generic
    url: https://app.dealingindia.com/downloads/updates/
    channel: latest
