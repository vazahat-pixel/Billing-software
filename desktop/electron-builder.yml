appId: com.textileerp.desktop
productName: Textile ERP
copyright: Copyright (C) Textile ERP
directories:
  output: dist
  buildResources: assets
files:
  - main.js
  - preload.js
  - updater.js
  - machineId.js
  - config.json
  - config.example.json
  - localRuntime/**/*
  - renderer/**/*
  - assets/**/*
extraResources:
  - from: config.json
    to: config.json
  - from: config.example.json
    to: config.example.json
asarUnpack:
  - localRuntime/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: TextileERP-Setup-${version}.${ext}
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Textile ERP
  deleteAppDataOnUninstall: false
publish:
  - provider: generic
    url: https://updates.example.com/textile-erp/
    channel: latest
